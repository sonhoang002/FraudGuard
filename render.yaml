databases:
  - name: fraudguard-db
    plan: free
    postgresMajorVersion: "18"

services:
  - type: web
    name: fraudguard-ml
    runtime: docker
    plan: free
    dockerfilePath: ./ml_service/Dockerfile
    dockerContext: ./ml_service
    healthCheckPath: /health
  - type: web
    name: fraudguard-api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraudguard-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: fraudguard-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: fraudguard-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_TIMEOUT_MS
        value: 60000
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:render
    dockerContext: .
    initialDeployHook: npm run seed
    healthCheckPath: /ready
  - type: web
    name: fraudguard-frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: fraudguard-api
          envVarKey: RENDER_EXTERNAL_URL
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    staticPublishPath: ./frontend/dist
